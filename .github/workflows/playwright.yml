# @format
name: Playwright Tests

on:
      push:
            branches: [main, master]
      pull_request:
            branches: [main, master]

jobs:
      test:
            timeout-minutes: 60
            runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v5
                  - uses: actions/setup-node@v5
                    with:
                          node-version: lts/*

                  - name: Install dependencies
                    run: npm ci

                  - name: Azure Login
                    uses: azure/login@v2
                    with:
                          creds: ${{ secrets.AZURE_CREDENTIALS }}

                  - name: Run Playwright tests
                    id: playwright-tests
                    env:
                          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
                    run: npx playwright test --grep @Login --config=playwright.service.config.js --workers=4

                  - name: Archive Playwright report
                    id: archive-report
                    if: ${{ always() }}
                    run: |
                          if [ ! -d playwright-report ]; then
                            echo "Playwright report directory was not generated." >&2
                            exit 1
                          fi
                          zip -r playwright-report.zip playwright-report

                  - uses: actions/upload-artifact@v4
                    if: ${{ !cancelled() }}
                    with:
                          name: playwright-report
                          path: playwright-report/
                          retention-days: 30

                  - name: Email Playwright report
                    if: ${{ always() && !cancelled() }}
                    uses: dawidd6/action-send-mail@v3
                    with:
                          server_address: ${{ vars.SMTP_SERVER }}
                          server_port: ${{ vars.SMTP_PORT }}
                          secure: ${{ vars.SMTP_SECURE == 'true' }}
                          username: ${{ secrets.SMTP_USERNAME }}
                          password: ${{ secrets.SMTP_PASSWORD }}
                          subject: Playwright test report - ${{ job.status }}
                          to: ${{ vars.REPORT_EMAIL_TO }}
                          from: ${{ secrets.SMTP_USERNAME }}
                          body: |
                                The Playwright test run has completed.

                                Result: ${{ steps.playwright-tests.outcome }}
                                Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                          attachments: playwright-report.zip
